name: Tend the bonsai

on:
  schedule:
    - cron: '21 0 * * *' # Daily at 08:21 in Malaysia (UTC+8).
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bonsai.yml'

permissions:
  contents: read

concurrency:
  group: profile-bonsai
  cancel-in-progress: false

jobs:
  grow:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Grow and save the bonsai
        uses: egorthinks/git-bonsai@bec04c39f62731fdb28c3b82322ef21cbf3bdfac # v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          user: S-W-Leong
          output-dir: assets/bonsai
          commit-message: 'chore: tend the profile bonsai'
